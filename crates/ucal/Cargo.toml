[package]
name = "ucal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Universe Calendar: absolute time in Planck ticks with a base-5 tier calendar"
readme = "README.md"
categories = ["command-line-utilities", "date-and-time", "science"]
keywords = ["time", "calendar", "datetime", "planck", "cosmology"]

[dependencies]
ucal-core = { workspace = true }
ucal-civil = { workspace = true, optional = true }
# The facade may depend on both; §12 forbids only ucal-body -> ucal-civil.
ucal-body = { workspace = true, optional = true }
ucal-events = { workspace = true, optional = true }
ucal-cosmo = { workspace = true, optional = true }
clap = { version = "4", features = ["derive", "wrap_help"] }
# Completions are *generated* from the clap definition above rather than
# written, so they cannot list a command that does not exist or miss one that
# does. That property is the reason for the dependency; the feature is a
# by-product of it.
clap_complete = "4"
# The man page, generated from the same definition for the same reason.
clap_mangen = "0.2"
# §15.1 names this loader. It is a dependency of the *binary* and not of any
# library crate: see `body_file.rs` for why the loader cannot live in
# `ucal-body` without a breaking change, and D-A20 for the record.
deser-hjson = "2"
serde = { version = "1", features = ["derive"] }
# Already in the tree through clap: making it direct adds a line to this
# manifest and nothing to the dependency graph. Only the SGR value types are
# used -- the tty test is std's `IsTerminal` and the choice logic is ours.
anstyle = "1"
# Also already in the tree through clap. Used for one call: how many columns the
# terminal has, when there is one.
terminal_size = "0.4"
# The wall clock, and nothing else. Optional and **not** in `default`:
# `GE-U4-tier-navigator.md` recorded that ratatui and crossterm are a large tree
# and that `cargo install ucal` should stay lean. The release workflow builds
# with `--features tui`, so the published binaries have it and a source install
# opts in.
ratatui = { version = "0.29", optional = true, default-features = false, features = ["crossterm"] }
crossterm = { version = "0.28", optional = true }

[features]
default = ["u512", "std", "civil", "body", "events", "cosmo"]
u512 = ["ucal-core/u512", "ucal-civil?/u512", "ucal-body?/u512", "ucal-events/u512", "ucal-cosmo?/u512"]
bigint = ["ucal-core/bigint", "ucal-civil?/bigint", "ucal-body?/bigint", "ucal-events/bigint", "ucal-cosmo?/bigint"]
std = ["ucal-core/std", "ucal-civil?/std", "ucal-body?/std", "ucal-events/std", "ucal-cosmo?/std"]
civil = ["dep:ucal-civil", "ucal-civil/hifitime"]
body = ["dep:ucal-body"]
events = ["dep:ucal-events"]
cosmo = ["dep:ucal-cosmo"]
# The `ucal wallclock` TUI. Not default: see the dependency's comment.
#
# `civil` is not optional here. The clock reads the system clock, which arrives
# as UTC and has to come through the bundled leap table — the one quantity §8.4
# says cannot be computed and must be looked up. Declared rather than assumed:
# `--features u512,std,tui` built fine as long as `default` happened to supply
# `civil`, and failed the moment it did not, which is the third defect the
# features workflow has caught by building a combination nobody would type.
tui = ["dep:ratatui", "dep:crossterm", "std", "civil"]

[dev-dependencies]
ucal-events = { workspace = true }
# `TestBackend` renders a face into a buffer, so the clock is checkable without
# a terminal. Same crate as the dependency above; the dev entry only makes the
# testing backend available when the `tui` feature is on.
ratatui = { version = "0.29", default-features = false }

[[bin]]
name = "ucal"
path = "src/main.rs"

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"
