[package]
name = "ucal-cosmo"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Universe Calendar cosmology: flat LambdaCDM by certified integer interval quadrature"
readme = "README.md"
categories = ["science", "mathematics"]
keywords = ["cosmology", "redshift", "interval-arithmetic", "physics", "lambda-cdm"]

[dependencies]
ucal-core = { version = "0.2.0", path = "../ucal-core", default-features = false }

[dev-dependencies]
# Rule E: a float reference implementation is permitted in dev-dependencies
# ONLY as a test oracle, and must be marked as such. There is no float crate
# here; the oracle is a handful of `f64` lines inside `#[cfg(test)]`, contained
# by the `float-oracle` module and by the lint's allow marker.
ucal-events = { version = "0.2.0", path = "../ucal-events", default-features = false }

[features]
default = ["u512", "std"]
u512 = ["ucal-events/u512", "ucal-core/u512"]
bigint = ["ucal-events/bigint", "ucal-core/bigint"]
std = ["ucal-core/std", "ucal-events/std", "alloc"]
alloc = ["ucal-core/alloc", "ucal-events/alloc"]

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"
