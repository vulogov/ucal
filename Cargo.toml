[workspace]
resolver = "2"
members = [
    "crates/ucal-core",
    "crates/ucal-civil",
    "crates/ucal",
    "crates/ucal-body",
    "crates/ucal-events",
    "crates/ucal-cosmo",
    "xtask",
]
# The fuzz targets need nightly and libFuzzer; excluding them keeps
# `cargo build --workspace` and the 1.88 MSRV job away from both.
exclude = ["fuzz"]

[workspace.package]
version = "1.9.0"
edition = "2021"
# Set by the `tui` feature's tree in 1.5.0: ratatui reaches instability and
# darling, which declare 1.88. Before that it was set by the default backend —
# bnum 0.14 requires 1.87 — and that floor is still the one that binds every
# library crate. This is a binary-only feature raising the workspace floor, which
# is why it is a minor-version change and is stated in the release notes.
# Verified by CI at exactly this version, on the workspace and on `--features
# tui` -- it read 1.85 until 0.6.0 and had been false since bnum was updated,
# because nothing checked it.
rust-version = "1.88"
license = "MPL-2.0"
authors = ["Vladimir Ulogov"]
repository = "https://github.com/vulogov/ucal"
description = "Universe Calendar: absolute time in Planck ticks with a base-5 tier calendar"

[workspace.dependencies]
# The internal crates. Their version requirements live here and nowhere else:
# thirteen copies were thirteen chances to bump twelve of them, and the failure
# is silent — a 0.3.0 facade resolving against a 0.2.x core still builds.
# `xtask -- lint` now asserts that every one of these equals the workspace
# package version, so the drift is caught rather than published.
ucal-core = { version = "1.9.0", path = "crates/ucal-core", default-features = false }
ucal-civil = { version = "1.9.0", path = "crates/ucal-civil", default-features = false }
ucal-body = { version = "1.9.0", path = "crates/ucal-body", default-features = false }
ucal-events = { version = "1.9.0", path = "crates/ucal-events", default-features = false }
ucal-cosmo = { version = "1.9.0", path = "crates/ucal-cosmo", default-features = false }

# Default backend (RFC §3.1, D-4). NOTE: bnum 0.14 restructured its type surface
# and renamed `parse_str_radix` -> `from_str_radix`; `ZERO`/`ONE` became private.
# The RFC §3.3 signatures are pre-0.14. All churn is absorbed by the `TickInt`
# layer in ucal-core, per GE-4.
bnum = { version = "0.14", default-features = false }
num-bigint = { version = "0.4", default-features = false }
num-integer = { version = "0.1", default-features = false }
num-traits = { version = "0.2", default-features = false }

[profile.release]
overflow-checks = true   # Rule O: never wrap, even in release
