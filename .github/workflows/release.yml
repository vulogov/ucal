# Prebuilt `ucal` binaries, attached to the release for a tag.
#
# `cargo install ucal` needs a Rust toolchain. That is a reasonable ask of
# someone who already writes Rust and an unreasonable one of everybody else —
# and C3 in Documentation/CONTACT.md asks people to try the command line, which
# means the command line should be obtainable in one download.
#
# # What these artefacts are, and what they are not
#
# They are built by GitHub Actions from the tagged commit. The checksums beside
# them are produced by the same job, so **they are not the same kind of evidence
# as the conformance vectors**: `fixtures/SHA256SUMS.minisig` is signed by a key
# held on one laptop, and nothing here is. A checksum generated by the same
# process that produced the file it describes proves the download was not
# corrupted in transit and nothing else.
#
# That distinction is stated in the release body too, because a reader who has
# seen this project sign one thing may reasonably assume it signs everything.
#
# Reproducibility is not claimed. Nothing here pins the compiler version, and a
# reader who wants to check the binary should build it from the tag.

name: release

on:
  push:
    tags: ["v*"]
  # So the artefacts can be rebuilt for a tag that already exists without
  # moving it, which is what would otherwise be required after a runner outage.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and attach to (e.g. v1.0.0)"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux, statically linked against musl so it runs on any glibc.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            packer: tar
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            packer: tar
          # macOS, both architectures. No universal binary: two files that each
          # say what they are beats one that needs explaining.
          #
          # The Intel build is cross-compiled from an Apple-silicon runner,
          # because the `macos-13` image that would have run it natively has
          # been retired — a dispatch against it sat queued indefinitely rather
          # than failing. The runner cannot execute what it produced (no Rosetta
          # by default), so this is the one artefact `ucal verify` does not run
          # on, and `verify: false` says so here rather than the step quietly
          # not happening.
          - target: x86_64-apple-darwin
            os: macos-latest
            packer: tar
            verify: false
          - target: aarch64-apple-darwin
            os: macos-latest
            packer: tar
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            packer: zip
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: musl toolchain
        if: endsWith(matrix.target, '-musl')
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # Only the binary. The libraries are on crates.io; a download is for
      # somebody who wants to run the thing.
      - name: build
        run: cargo build --release --locked -p ucal --target ${{ matrix.target }}

      # A binary that cannot re-derive its own constants is not worth shipping.
      # Every target but one is built on a runner of its own architecture, so
      # the artefact can be executed rather than merely linked; the exception is
      # marked `verify: false` in the matrix above and named in the release body.
      #
      # The exit status is the check: `ucal verify` fails with `UCAL-E0015` and
      # §19.5's exit 9 when the build disagrees with the profile. It reported
      # the disagreement and exited 0 until this workflow was written, which is
      # why the check is the status and not a grep for a word in the output.
      - name: the binary reproduces the declared constants
        if: matrix.verify != false
        shell: bash
        run: |
          bin="target/${{ matrix.target }}/release/ucal"
          if [ -f "$bin.exe" ]; then bin="$bin.exe"; fi
          "$bin" verify

      - name: package
        shell: bash
        run: |
          set -eu
          tag="${{ inputs.tag || github.ref_name }}"
          name="ucal-${tag}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          if [ "${{ matrix.packer }}" = "zip" ]; then
            cp "target/${{ matrix.target }}/release/ucal.exe" "dist/$name/"
          else
            cp "target/${{ matrix.target }}/release/ucal" "dist/$name/"
          fi
          cp LICENSE README.md "dist/$name/"
          cp Documentation/CLI.md "dist/$name/CLI.md"
          cp Documentation/CONTACT.md "dist/$name/CONTACT.md"
          cd dist
          if [ "${{ matrix.packer }}" = "zip" ]; then
            7z a -tzip "$name.zip" "$name" >/dev/null
            artefact="$name.zip"
          else
            tar czf "$name.tar.gz" "$name"
            artefact="$name.tar.gz"
          fi
          # Both platforms, one command name.
          if command -v sha256sum >/dev/null; then
            sha256sum "$artefact" > "$artefact.sha256"
          else
            shasum -a 256 "$artefact" > "$artefact.sha256"
          fi
          echo "ARTEFACT=dist/$artefact" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  attach:
    name: attach to the release
    needs: build
    runs-on: ubuntu-latest
    steps:
      # Deliberately *not* `ref: inputs.tag`. This job needs the artefact notes,
      # which live with the workflow, and a tag cut before the workflow existed
      # does not have them. The first dispatch against v1.0.0 checked out the tag,
      # found no notes file, and appended an empty string to the release body
      # without failing — which is why the step below now refuses to continue if
      # the file is missing.
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: one checksum file for all of them
        run: |
          cd dist
          cat *.sha256 | sort -k2 > SHA256SUMS.txt
          rm -f *.sha256
          ls -la

      - name: attach
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          tag="${{ inputs.tag || github.ref_name }}"
          notes=.github/release-artefacts.md
          test -s "$notes" || { echo "$notes is missing or empty"; exit 1; }
          gh release view "$tag" >/dev/null 2>&1 \
            || gh release create "$tag" --title "$tag" --notes "Release $tag"
          gh release upload "$tag" dist/* --clobber
          # Append the artefact section once, rather than each time this runs.
          body=$(gh release view "$tag" --json body --jq .body)
          case "$body" in
            *"## Prebuilt binaries"*) echo "release body already describes the binaries" ;;
            *) printf '%s\n%s\n' "$body" "$(cat "$notes")" \
                 | gh release edit "$tag" --notes-file - ;;
          esac
