# C2 — notice when a cited URL rots.
#
# `check-links` has existed since 1.4.0 and has never run except when a person
# remembered. Every release note since has carried the cost in the same words —
# *nothing automatic notices when a cited URL rots* — and two locators had
# already rotted by the time the command was written, one of them answering
# `200 OK` from a page that was not the cited document.
#
# # Why this is not in `verify.yml`
#
# Because it would make somebody else's outage turn this repository red, and
# "CI green on every push, with no known-failing job" is a 1.0 exit criterion.
# A check that cries wolf trains its reader to ignore it, and ROAD-TO-1.0.md
# records a criterion that was asserted for a whole release while being false —
# which happened because nobody read a red job.
#
# A scheduled workflow has neither problem. It cannot block a push, it fails on
# its own account, and once a week is the resolution this question has: a URL
# that rots on Tuesday and is noticed on Monday was not going to be noticed at
# all under the old arrangement.
#
# # The wire
#
# A scheduled job that fails into the Actions tab is a mechanism with nothing
# attached to it, which is the shape this project keeps finding in its own work.
# So a failure **opens an issue**, and a later failure comments on the open one
# rather than opening a second. That is the notification; the run itself is just
# where the detail lives.
#
# # Only on `main`
#
# GitHub runs `schedule:` only on the default branch. This file is on `main`
# ahead of the 1.9.0 merge for exactly that reason — a schedule sitting on a
# development branch is a schedule that never fires, which is the failure this
# job exists to fix, reproduced in the fix.

name: links

on:
  schedule:
    # 07:00 UTC every Monday. A weekday morning, so a failure is read by
    # somebody rather than accumulating over a weekend, and a fixed hour so the
    # run is a heartbeat: a week with no run at all is itself a finding.
    - cron: "0 7 * * 1"
  workflow_dispatch:
    inputs:
      rehearse:
        description: >-
          Fail the check on purpose, to prove the issue actually gets opened.
          Every other check in this tree is verified strict by injecting the
          defect it exists to catch; a notification path deserves the same, and
          cannot get it from a run where nothing is wrong.
        type: boolean
        default: false

# Not `push:`. See the header — that is the whole design of this file.

permissions:
  contents: read
  issues: write

env:
  # `never`, where every other workflow here says `always`. This log is pasted
  # into an issue body, and the first rehearsal produced one that opened with
  # forty lines of escape-coded `Downloading` — which is what a rehearsal is
  # for. Colour is for a terminal; an issue is not one.
  CARGO_TERM_COLOR: never

jobs:
  links:
    name: cited URLs still resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Built separately so the log the issue carries is the *check's* output
      # and not cargo's. The same first rehearsal buried the verdict under the
      # dependency download that preceded it.
      - name: build xtask
        run: cargo build -p xtask --quiet

      - name: check-links
        id: check
        run: |
          set -o pipefail
          ./target/debug/xtask check-links 2>&1 | tee links.log
          if [ "${{ inputs.rehearse }}" = "true" ]; then
            echo "  REHEARSAL: failing on purpose to exercise the issue path." \
              | tee -a links.log
            exit 2
          fi
        continue-on-error: true

      # The wire. `check-links` exits 2 for unreachable *and* for a redirect
      # that leaves the host, because a citation landing on a different site
      # needs a person even at 200.
      - name: open or update the issue
        if: steps.check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ inputs.rehearse }}" = "true" ]; then
            title="A cited URL no longer resolves (rehearsal)"
          else
            title="A cited URL no longer resolves"
          fi
          existing=$(gh issue list --state open --search "$title in:title" \
            --json number --jq '.[0].number // empty')
          body=$(printf '%s\n\n```\n%s\n```\n' \
            "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            "$(tail -c 40000 links.log)")
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi

      # The job's own verdict, after the issue is filed. Reported separately so
      # a failure to *file* cannot be mistaken for the links being fine.
      - name: fail if any citation rotted
        if: steps.check.outcome == 'failure'
        run: |
          echo "check-links reported a rotted or redirected citation; see the issue."
          exit 1
