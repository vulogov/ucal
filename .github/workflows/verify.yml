# The verification block from Documentation/Release_Notes/README.md, run on
# every push instead of when someone remembers.
#
# What this protects against, stated at its real size: this repository has one
# contributor, so CI mostly protects that contributor from themselves. That is
# not nothing — several defects in 0.3.0 and 0.4.0 were found by running
# something rather than by reading it — but it is not the usual claim for CI and
# should not be made to sound like it.
#
# The job list is deliberately the same list as the release procedure. If the
# two drift, the procedure is the one that is right, and this file is wrong.

name: verify

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Rule O: never wrap, even in release. The profile sets this too; setting it
  # here as well means a job that somehow bypasses the profile still gets it.
  RUSTFLAGS: -D warnings

jobs:
  tests:
    name: tests, both integer backends
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # The default backend: bnum's stack-allocated u512.
      - name: default backend
        run: cargo test --workspace --release

      # Rule W: the two backends must agree byte for byte. Nothing checks that
      # at runtime -- backend.rs refuses to compile both at once -- so this job
      # is the only place the claim is tested.
      - name: bigint backend
        run: |
          cargo test --workspace --exclude xtask --release \
            --no-default-features \
            --features bigint,std,ucal-civil/hifitime,ucal/civil,ucal/body,ucal/events,ucal/cosmo

  build:
    name: warnings, and the no-alloc target
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2

      # --all-targets, so test and example files are compiled under -D warnings
      # too. Without it `cargo build` never touches a test file, and the first
      # CI run failed on three unused imports that the local gate could not see.
      - name: workspace builds clean
        run: cargo build --workspace --all-targets --release

      # GE-5: ucal-core with no allocator. `bigint` implies `alloc`, so a
      # no-alloc build is a u512 build by construction.
      - name: ucal-core on wasm, no_std, no allocator
        run: |
          cargo build -p ucal-core --target wasm32-unknown-unknown \
            --no-default-features --features u512

  semver:
    name: the semver floor, checked
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          # `--default-features` is not a preference. Without it the tool
          # enables every feature at once, which trips the `u512`/`bigint`
          # guard and it cannot build the crate at all.
          feature-group: default-features
      # Load-bearing from 1.1.0 onward.
      #
      # Under `0.x` a minor bump already permitted breaking changes, so the tool
      # skipped its breaking-change lints and this job passed on any diff. It
      # was installed anyway, so that it would be exercised before it mattered.
      # With 1.0.0 published as a baseline it runs 196 checks per crate and is
      # the mechanism for the one promise in STABILITY.md that had none — the
      # semver floor itself.
      #
      # It earned its place before it was load-bearing: run against a
      # patch-level baseline during 0.9.0 it found a `Code` variant inserted
      # mid-enum, shifting every later discriminant and reordering a
      # `PartialOrd` derive. Nobody had noticed, in the cycle whose entire
      # product was supposed to be an empty Breaking section.

  msrv:
    name: the declared MSRV actually builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned to the exact version `rust-version` declares. Reading it from the
      # manifest would let the two drift apart silently in the direction that
      # matters -- a manifest lowered by hand and a job that follows it proves
      # nothing.
      - uses: dtolnay/rust-toolchain@1.87
      - uses: Swatinem/rust-cache@v2

      # `rust-version` was 1.85 until 0.6.0 and had been false since bnum was
      # updated to require 1.87. Nothing checked it, so nobody knew.
      - name: msrv matches the manifest
        run: |
          declared=$(grep -m1 '^rust-version' Cargo.toml | grep -oE '[0-9]+\.[0-9]+')
          test "$declared" = "1.87" || {
            echo "Cargo.toml declares $declared but this job pins 1.87."
            echo "Change both, and say so in the release notes: an MSRV bump is"
            echo "a minor-version change (Documentation/STABILITY.md)."
            exit 1
          }

      - name: workspace builds at the MSRV
        run: cargo build --workspace --all-targets

      # The `tui` feature needs 1.88, through ratatui -> instability -> darling.
      # It is the one stated exception (Documentation/STABILITY.md) and this
      # keeps it exactly one feature wide: if the exception ever silently
      # disappears the assertion below fails too, and someone has to decide
      # whether the note is still true.
      - name: the tui exception is exactly one feature wide
        run: |
          if cargo build -p ucal --features tui 2>/dev/null; then
            echo "\`--features tui\` now builds at 1.87."
            echo "That is good news and makes STABILITY.md's stated MSRV"
            echo "exception false. Remove the exception and this check."
            exit 1
          fi
          echo "ok: --features tui does not build at 1.87, as documented"
          # `if !` rather than `&&`: the runner uses `bash -e`, under which a
          # failing left-hand side of `&&` ends the step. The failure is the
          # expected outcome here, so it has to be tested and not merely run.
          if cargo build -p ucal --all-features 2>/dev/null; then
            echo "--all-features built at 1.87, which contradicts the above."
            exit 1
          fi
          echo "ok: the exception is the tui feature and nothing else"

  checks:
    name: harness, lints, docs, vectors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # UC-P0: two independent exact-integer derivations of every constant.
      - name: constants harness
        run: cargo run -p xtask

      # Rules E, O, A.2/Y, Q.1, §12, version lockstep, indented literals.
      # Exemptions are printed, so one is a visible cost rather than a silence.
      - name: workspace lints
        run: cargo run -p xtask -- lint

      # §13.5's single source of truth, every citation resolving against spec/,
      # and Documentation/CLI.md covering the command surface.
      - name: generated docs and citations
        run: cargo run -p xtask -- check-docs

      # Re-derives the conformance vectors along both integer routes and checks
      # them against the committed digest. Reports UNSIGNED rather than ok when
      # no signature is present: a digest proves integrity, not provenance.
      - name: conformance vectors
        run: cargo run -p xtask -- verify-vectors
