# S4: the feature combinations that are supported, and the ones that must fail.
#
# The verify workflow tests two combinations — the default and `bigint`. That is
# a sample of a space with many more points in it, and until 0.6.0 three
# unsupported combinations failed with a cascade of twenty errors rather than a
# sentence, which is unsupported by accident rather than by design.
#
# `Documentation/STABILITY.md` lists what is supported. This is what makes that
# list true.

name: features

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  supported:
    name: every supported combination builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2

      # ucal-core is the crate that runs without an allocator (GE-5).
      - run: cargo build -p ucal-core --no-default-features --features u512
      - run: cargo build -p ucal-core --no-default-features --features u512,alloc
      - run: cargo build -p ucal-core --no-default-features --features u512,std
      # `bigint` implies `alloc`: a heap-backed integer cannot be built without
      # one, which is why GE-5's no-alloc build is a u512 build by construction.
      - run: cargo build -p ucal-core --no-default-features --features bigint
      - run: cargo build -p ucal-core --no-default-features --features bigint,std

      # Everything above core needs an allocator and now says so.
      - run: cargo build -p ucal-civil --no-default-features --features u512,std
      - run: cargo build -p ucal-civil --no-default-features --features u512,std,hifitime
      - run: cargo build -p ucal-body  --no-default-features --features u512,std
      - run: cargo build -p ucal-events --no-default-features --features u512,std
      - run: cargo build -p ucal-cosmo --no-default-features --features u512,std

      # The facade, each optional crate on its own.
      - run: cargo build -p ucal --no-default-features --features u512,std
      - run: cargo build -p ucal --no-default-features --features u512,std,civil
      - run: cargo build -p ucal --no-default-features --features u512,std,body,civil
      - run: cargo build -p ucal --no-default-features --features u512,std,events
      - run: cargo build -p ucal --no-default-features --features u512,std,cosmo
      # The wall clock. `tui` needs `civil` (it reads the system clock through
      # the leap table), and the two combinations below check that the feature
      # declares that dependency rather than relying on `default` to supply it.
      - run: cargo build -p ucal --no-default-features --features u512,std,civil,tui
      - run: cargo build -p ucal --features tui

  refused:
    name: every unsupported combination fails with a sentence
    runs-on: ubuntu-latest
    # This job reads cargo's output as text, so it must ask for text. With the
    # workspace default of `always`, every diagnostic arrives as
    # `ESC[1mESC[91merrorESC[0m: …` and an anchored `^error` matches nothing —
    # which is how the ordering assertion below failed for the whole of 0.6.0
    # while the guard it checks was working correctly.
    env:
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # A combination that merely fails is unsupported by accident. One that
      # fails with a stated reason is unsupported by design, and the difference
      # is what a caller sees at 2am.
      - name: no backend is refused, by name
        run: |
          out=$(cargo build -p ucal-core --no-default-features 2>&1 || true)
          echo "$out" | grep -q "exactly one of the .u512. or .bigint. features" \
            || { echo "$out"; echo "expected the backend guard"; exit 1; }

      # And it must be the *first* error. It used to emit "the name `imp` is
      # defined multiple times" ahead of the guard, which is the error a caller
      # reads and the one that says nothing.
      - name: both backends are refused, by name, first
        run: |
          out=$(cargo build -p ucal-core --no-default-features --features u512,bigint 2>&1 || true)
          echo "$out" | grep -q "mutually exclusive" \
            || { echo "$out"; echo "expected the backend guard"; exit 1; }
          first=$(echo "$out" | grep -m1 "^error")
          echo "$first" | grep -q "mutually exclusive" \
            || { echo "$out"; echo "--- first error line was: '$first'"; exit 1; }

      - name: a crate above core without alloc is refused, by name
        run: |
          for c in ucal-body ucal-events ucal-cosmo; do
            out=$(cargo build -p $c --no-default-features --features u512 2>&1 || true)
            echo "$out" | grep -q "requires the .alloc. feature" \
              || { echo "$out"; echo "$c did not name the missing feature"; exit 1; }
          done
